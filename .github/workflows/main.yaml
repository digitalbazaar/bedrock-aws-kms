name: Bedrock Node.js CI

on: [push]

jobs:
  vendor-checksums:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed binaries match committed checksums
        run: cd vendor/alpine-x64 && sha256sum --check SHA256SUMS
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - name: Run eslint
        run: npm run lint
  test-node:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      fakecloud:
        image: ghcr.io/faiscadev/fakecloud:latest
        ports:
          - 4566:4566
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Wait for FakeCloud
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:4566/_fakecloud/health; then
              exit 0
            fi
            sleep 1
          done
          echo "FakeCloud did not become ready." >&2
          exit 1
      - run: |
          npm install
          cd test
          npm install
      - name: Run test with Node.js ${{ matrix.node-version }}
        run: |
          cd test
          npm test
